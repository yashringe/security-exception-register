name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test (unit + Testcontainers integration tests)
        run: mvn -B verify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/kri_report
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  end-to-end:
    runs-on: ubuntu-latest
    needs: [java, python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Start app and database
        run: docker compose up -d --build --wait
      - name: Seed demo data and build the KRI report
        working-directory: tools/kri_report
        run: |
          pip install -r requirements.txt
          python seed_demo.py --url http://localhost:8080
          python kri_report.py --url http://localhost:8080 --out report.html || echo "red KRIs present (expected with demo data)"
      - uses: actions/upload-artifact@v4
        with:
          name: kri-report
          path: tools/kri_report/report.html
      - if: always()
        run: docker compose logs app
